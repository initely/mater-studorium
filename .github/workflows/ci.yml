name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Версия Flutter зафиксирована здесь, в одном месте (stable, как локально).
  FLUTTER_VERSION: "3.47.2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Невидимые, bidi и управляющие символы в исходниках (Trojan Source):
      # в тестах и инструментах только escape-последовательностями.
      - run: python3 -I tools/check_invisible_chars.py
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Validate decks (schema + semantics)
        run: dart run tools/validate_deck.dart content/decks/*.json
      - run: flutter build web

  # Edge Functions (_shared/, grade-open-answer/) и eval T07. Без ключей и без
  # обращений к Supabase и OpenRouter: тесты на чистые функции, фейковые
  # зависимости и фейковый fetch (сеть нужна только для загрузки jsr:@std).
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          # Та же версия, что локально (deno --version).
          deno-version: v2.9.7
      - run: deno fmt --check supabase/functions eval/grading/run.ts eval/grading/tune.ts
      - run: deno lint supabase/functions eval/grading/run.ts eval/grading/tune.ts
      - run: deno check supabase/functions/grade-open-answer/index.ts eval/grading/run.ts eval/grading/tune.ts
      - run: deno test supabase/functions
      # Ключ OpenRouter не должен попасть в репозиторий ни в каком файле
      # (только текущее дерево; историю сканирует gitleaks, см. README функции).
      # Шаблон сам с собой не совпадает (после «v» идёт «[», а не цифра).
      # rc 1 — совпадений нет (успех); 0 — найден ключ, 2 — ошибка git grep.
      # `|| rc=$?`: шаг идёт под bash -e, иначе rc 1 сразу уронил бы его.
      - run: |
          rc=0
          git grep -nIiE 'sk-or-v[0-9]+-[0-9a-f]{16,}' || rc=$?
          test "$rc" -eq 1

  # pgTAP-тесты RLS на локальном Supabase (Docker есть на ubuntu-latest).
  supabase-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Та же версия, что локально (supabase --version).
          version: 2.120.0
      # Только Postgres (без Auth, Studio и т. п.): pgTAP-тестам больше не нужно.
      - run: supabase db start
      - run: supabase db lint --fail-on error
      - run: supabase test db
