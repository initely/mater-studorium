name: CI

on:
  push:
  pull_request:

env:
  # Версия Flutter зафиксирована здесь, в одном месте (stable, как локально).
  FLUTTER_VERSION: "3.47.2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web

  # pgTAP-тесты RLS на локальном Supabase (Docker есть на ubuntu-latest).
  supabase-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Та же версия, что локально (supabase --version).
          version: 2.120.0
      - run: supabase start
      - run: supabase test db
