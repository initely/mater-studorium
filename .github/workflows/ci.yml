name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Версия Flutter зафиксирована здесь, в одном месте (stable, как локально).
  FLUTTER_VERSION: "3.47.2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Validate decks (schema + semantics)
        run: dart run tools/validate_deck.dart content/decks/*.json
      - run: flutter build web

  # Общий код Edge Functions (_shared/grading.ts, openrouter.ts) и eval T07.
  # Без сети и без ключей: тесты на чистые функции и фейковый fetch.
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          # Та же версия, что локально (deno --version).
          deno-version: v2.9.7
      - run: deno fmt --check supabase/functions eval/grading/run.ts eval/grading/tune.ts
      - run: deno lint supabase/functions eval/grading/run.ts eval/grading/tune.ts
      - run: deno check eval/grading/run.ts eval/grading/tune.ts
      - run: deno test supabase/functions

  # pgTAP-тесты RLS на локальном Supabase (Docker есть на ubuntu-latest).
  supabase-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Та же версия, что локально (supabase --version).
          version: 2.120.0
      # Только Postgres (без Auth, Studio и т. п.): pgTAP-тестам больше не нужно.
      - run: supabase db start
      - run: supabase db lint --fail-on error
      - run: supabase test db
