name: CI

on:
  push:
  pull_request:

env:
  # Версия Flutter зафиксирована здесь, в одном месте (stable, как локально).
  FLUTTER_VERSION: "3.47.2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Validate decks (schema + semantics)
        run: dart run tools/validate_deck.dart content/decks/*.json
      - run: flutter build web
